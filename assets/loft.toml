[package]
name    = "assets"
version = "0.5.0"
loft    = ">=2026.10.20261012"   # the first loft whose `index` is a B+tree (C147) is the
                                 # main build of 2026-10-12.  An older loft keeps resolving
                                 # to 0.4.2, whose pack layout is the one it writes; its
                                 # own floor, >=2026.10.20261006, named the first loft
                                 # with C138 (L-Align).
description = "A game's content pack that IS a loft store — art, audio and the scenes that place them, range-read off a static file server.  No codec, no parse step, no server-side code."
categories  = ["game", "asset-format"]

api_compatible_with  = "0.2.0"   # 0.3.0 is additive: `Tile`, `texels` and `page_grid`
                                 # are new names and no existing one moved.  0.2.0 was
                                 # the DECLARED BREAK — `Cell` gained `ce_proxy`, and a
                                 # pack is a STORE, so the struct definitions ARE the
                                 # file layout and a 0.1.0 pack is not readable here.
data_compatible_with = "0.5.0"   # loft's C147 keeps an index's tree apart from its
                                 # records, so `Placed` lost the three link fields the
                                 # red-black tree kept in it and went 104 -> 96 bytes:
                                 # a 0.4.x pack is refused, not misread.  0.4.0 was
                                 # the floor before (C138's alignment), 0.2.0 before
                                 # that; `layout_fingerprint()` moved each time
                                 # (tests/layout.loft keeps every number)

[library]
entry = "src/assets.loft"

[dependencies]
shapes = ">=0.5.0"
