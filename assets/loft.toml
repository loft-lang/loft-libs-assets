[package]
name    = "assets"
version = "0.4.2"
loft    = ">=2026.10.20261006"   # the first loft with C138 (L-Align) is the main build of
                                 # 2026-10-06; loft 2026.10.0 predates it.  0.4.0 shipped
                                 # with the old >=2026.9.0 floor, so on 2026.10.0 its layout
                                 # test failed and its packs missed their declared format.
                                 # 0.4.1 is 0.4.0 with this floor: same API, same pack
                                 # format, so both compatibility lines below stand.
description = "A game's content pack that IS a loft store — art, audio and the scenes that place them, range-read off a static file server.  No codec, no parse step, no server-side code."
categories  = ["game", "asset-format"]

api_compatible_with  = "0.2.0"   # 0.3.0 is additive: `Tile`, `texels` and `page_grid`
                                 # are new names and no existing one moved.  0.2.0 was
                                 # the DECLARED BREAK — `Cell` gained `ce_proxy`, and a
                                 # pack is a STORE, so the struct definitions ARE the
                                 # file layout and a 0.1.0 pack is not readable here.
data_compatible_with = "0.4.0"   # loft's C138 (L-Align) padded five packed records to
                                 # their alignment, so the element strides moved:
                                 # a 0.3.x pack is refused, not misread.  0.2.0 was
                                 # the floor before; `layout_fingerprint()` moved
                                 # with it (tests/layout.loft keeps both numbers)

[library]
entry = "src/assets.loft"

[dependencies]
shapes = ">=0.5.0"
